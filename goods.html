<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Товары — DBGD</title>
    <meta name="description" content="Программы собственной разработки с доставкой в Telegram.">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <a href="main.html" class="site-logo"><img src="logo.png" alt="DBGD"></a>
    <hr>
    <div class="link-center">
        <a href="main.html">Главная</a>
        <a href="goods.html" class="nav-current">Товары</a>
        <a href="services.html">Услуги</a>
        <a href="order.html">Заказ</a>
        <a href="Contacts.html">Контакты</a>
        <a href="korzina.html" class="cart-link">🧺<span class="cart-badge"></span></a>
    </div>
    <hr>
    
    <h2 style="font-size: 2.5em; text-align: center; color:darkblue">Товары</h2>
    <hr>
    <marquee class="marq-goods" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 200; color: red;" direction="">Здесь все товары обновленные!</marquee>

    <div class="orders-recommendations">
        <h2>Рекомендації від розробника для вашого життя</h2>
        <div class="cards-container" id="products-container">
            <p class="cart-empty">Загрузка товаров...</p>
        </div>
    </div>

    <!-- Сначала загружаем cart.js, чтобы получить доступ к функции addToCart -->
    <script src="cart.js"></script>
    
    <!-- Принудительный скрипт загрузки товаров -->
    <script>
        async function forceLoadProducts() {
            const container = document.getElementById('products-container');
            if (!container) return;
            
            try {
                // Обращаемся к вашей базе
                const res = await fetch('/api/products');
                if (!res.ok) throw new Error('Ошибка ответа сервера');
                
                const data = await res.json();
                
                if (!data.products || data.products.length === 0) {
                    container.innerHTML = '<p class="cart-empty">Товаров пока нет.</p>';
                    return;
                }
                
                container.innerHTML = ''; // Очищаем текст "Загрузка..."
                
                // Рисуем каждый товар
                data.products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <button class="favorite-btn">✺</button>
                        ${p.image ? '<img src="' + p.image + '" alt="Картинка товара">' : '<div class="cart-row-noimg">🛒</div>'}
                        <p class="card-title">${p.name}</p>
                        ${p.oldPrice ? '<p class="old-price">' + p.oldPrice + ' грн</p>' : ''}
                        <p class="new-price">${p.price} грн</p>
                        ${p.description ? '<p style="font-size: 13px; color: #555;">' + p.description + '</p>' : ''}
                        <p class="delivery-online">Безкоштовна відправка через <span class="tg-badge">TELEGRAM</span></p>
                        <button type="button" class="add-to-cart-btn">Добавить в корзину</button>
                    `;
                    
                    // Безопасно привязываем кнопку к корзине
                    card.querySelector('.add-to-cart-btn').addEventListener('click', () => {
                        if (typeof addToCart === 'function') {
                            addToCart(p.id, p.name, p.price, p.image || '');
                        } else {
                            console.error('Функция addToCart не найдена в cart.js');
                            alert('Ошибка: корзина не подключена');
                        }
                    });
                    
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="cart-empty" style="color: red;">Ошибка при загрузке списка товаров.</p>';
            }
        }

        // Запускаем немедленно
        forceLoadProducts();
    </script>
</body>
</html>
