<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Заказ — DBGD</title>
    <meta name="description" content="Закажите обратный звонок или оформите индивидуальный заказ.">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta property="og:title" content="Заказ — DBGD">
    <meta property="og:description" content="Закажите обратный звонок или оформите индивидуальный заказ.">
    <meta property="og:image" content="og-image.png">
    <meta property="og:type" content="website">
</head>
<body>
    <a href="main.html" class="site-logo"><img src="logo.png" alt="DBGD"></a>
    <hr>
    <div class="link-center">
        <a href="main.html">Главная</a>
        <a href="goods.html">Товары</a>
        <a href="services.html">Услуги</a>
        <a href="order.html" class="nav-current">Заказ</a>
        <a href="Contacts.html">Контакты</a>
        <a href="korzina.html" class="cart-link">🧺<span class="cart-badge"></span></a>
    </div>
    <hr>

    <h2 style="text-align: center;">Заказ</h2>
    <hr>

    <div class="cart-page">
        <form id="callback-form" class="order-form" onsubmit="submitCallback(event)">
            <h3>Заказать обратный звонок</h3>

            <label for="callback-name">Имя</label>
            <input type="text" id="callback-name" placeholder="Ваше имя" required minlength="2" autocomplete="name">

            <label for="callback-phone">Телефон</label>
            <input type="tel" id="callback-phone" placeholder="+380 XX XXX XX XX" required>

            <button type="submit" id="callback-submit-btn">Заказать звонок</button>
        </form>

        <form id="custom-order-form" class="order-form" onsubmit="submitCustomOrder(event)">
            <h3>Оформить индивидуальный заказ</h3>

            <label for="custom-order-name">Имя</label>
            <input type="text" id="custom-order-name" placeholder="Ваше имя" required minlength="2" autocomplete="name">

            <label for="custom-order-phone">Телефон</label>
            <input type="tel" id="custom-order-phone" placeholder="+380 XX XXX XX XX" required>

            <label for="custom-order-description">Что нужно сделать</label>
            <textarea id="custom-order-description" placeholder="Опишите задачу: что за программа или услуга, к какому сроку" rows="4" required minlength="10"></textarea>

            <button type="submit" id="custom-order-submit-btn">Отправить заказ</button>
        </form>
    </div>

    <script src="cart.js"></script>
</body>
</html>
