<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Админ-панель — DBGD</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <a href="main.html" class="site-logo"><img src="logo.png" alt="DBGD"></a>
    <hr>
    <div class="link-center">
        <a href="main.html">Главная</a>
        <a href="goods.html">Товары</a>
        <a href="services.html">Услуги</a>
        <a href="order.html">Заказ</a>
        <a href="Contacts.html">Контакты</a>
        <a href="korzina.html" class="cart-link">🧺<span class="cart-badge"></span></a>
    </div>
    <hr>

    <h2 style="text-align: center;">Админ-панель — Товары</h2>

    <div class="cart-page">
        <p id="admin-guard" style="text-align: center;">Проверка доступа...</p>

        <div id="admin-panel" style="display: none;">
            <form id="product-form" class="order-form" onsubmit="submitProductForm(event)">
                <input type="hidden" id="product-id">

                <label for="product-name">Название товара</label>
                <input type="text" id="product-name" required>

                <label for="product-price">Цена, грн</label>
                <input type="number" id="product-price" min="1" step="1" required>

                <label for="product-oldprice">Старая цена, грн (необязательно, для зачёркнутой цены)</label>
                <input type="number" id="product-oldprice" min="1" step="1">

                <label for="product-image">Имя файла картинки (файл должен быть загружен в репозиторий рядом с main.html)</label>
                <input type="text" id="product-image" placeholder="например plan.jpg">

                <label for="product-description">Описание (необязательно)</label>
                <textarea id="product-description" rows="3"></textarea>

                <button type="submit" id="product-submit-btn">Добавить товар</button>
                <button type="button" id="product-cancel-btn" class="promo-clear" style="display: none;" onclick="cancelProductEdit()">Отменить редактирование</button>
            </form>

            <h3 style="text-align: center; margin-top: 30px;">Текущие товары</h3>
            <div id="admin-products-list"></div>
        </div>
    </div>

    <script src="cart.js"></script>
    <script>
        async function checkAdminAccess() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                if (data.isAdmin) {
                    document.getElementById('admin-guard').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                    loadAdminProducts();
                } else {
                    document.getElementById('admin-guard').innerText = 'Доступ запрещён. Вы не являетесь администратором.';
                }
            } catch (err) {
                document.getElementById('admin-guard').innerText = 'Ошибка при проверке прав доступа.';
            }
        }

        async function loadAdminProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            const listDiv = document.getElementById('admin-products-list');
            
            if (!data.products || data.products.length === 0) {
                listDiv.innerHTML = '<p style="text-align: center;">Товаров пока нет.</p>';
                return;
            }

            listDiv.innerHTML = data.products.map(p => `
                <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px;">
                    <h4>${p.name}</h4>
                    <p>Цена: ${p.price} грн ${p.oldPrice ? `(Старая: <s>${p.oldPrice} грн</s>)` : ''}</p>
                    <p>Картинка: ${p.image || 'нет'}</p>
                    <button type="button" onclick="editProduct('${p.id}')">Редактировать</button>
                    <button type="button" class="promo-clear" onclick="deleteProduct('${p.id}')">Удалить</button>
                </div>
            `).join('');
            
            // Сохраняем товары локально, чтобы брать данные для формы редактирования
            window.adminProducts = data.products;
        }

        async function submitProductForm(event) {
            event.preventDefault();
            const id = document.getElementById('product-id').value;
            const name = document.getElementById('product-name').value;
            const price = document.getElementById('product-price').value;
            const oldPrice = document.getElementById('product-oldprice').value;
            const image = document.getElementById('product-image').value;
            const description = document.getElementById('product-description').value;

            const payload = { name, price, oldPrice, image, description };
            
            let url = '/api/products';
            let method = 'POST';

            if (id) {
                payload.id = id;
                method = 'PUT';
            }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (data.ok) {
                    alert(id ? 'Товар обновлен' : 'Товар добавлен');
                    cancelProductEdit();
                    loadAdminProducts();
                } else {
                    alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch (err) {
                alert('Произошла ошибка сети');
            }
        }

        function editProduct(id) {
            const product = window.adminProducts.find(p => p.id === id);
            if (!product) return;

            document.getElementById('product-id').value = product.id;
            document.getElementById('product-name').value = product.name;
            document.getElementById('product-price').value = product.price;
            document.getElementById('product-oldprice').value = product.oldPrice || '';
            document.getElementById('product-image').value = product.image || '';
            document.getElementById('product-description').value = product.description || '';

            document.getElementById('product-submit-btn').innerText = 'Сохранить изменения';
            document.getElementById('product-cancel-btn').style.display = 'inline-block';
            window.scrollTo(0, 0);
        }

        function cancelProductEdit() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('product-submit-btn').innerText = 'Добавить товар';
            document.getElementById('product-cancel-btn').style.display = 'none';
        }

        async function deleteProduct(id) {
            if (!confirm('Вы уверены, что хотите удалить этот товар?')) return;
            
            try {
                const res = await fetch(`/api/products?id=${id}`, { method: 'DELETE' });
                const data = await res.json();
                
                if (data.ok) {
                    alert('Товар удален');
                    loadAdminProducts();
                } else {
                    alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch(err) {
                 alert('Произошла ошибка сети');
            }
        }

        // Запуск при загрузке страницы
        checkAdminAccess();
    </script>
</body>
</html>
